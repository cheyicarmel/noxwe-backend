services:
  postgres:
    image: postgres:16-alpine
    container_name: noxwe_postgres
    environment:
      POSTGRES_DB: noxwe_db
      POSTGRES_USER: noxwe_user
      POSTGRES_PASSWORD: devprodnoxwesaas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noxwe_user -d noxwe_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: noxwe_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: