name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: noxwe_test_db
          POSTGRES_USER: noxwe_user
          POSTGRES_PASSWORD: devprodnoxwesaas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Vérification de la qualité du code
        run: |
          black --check .
          flake8 .

      - name: Analyse de sécurité
        run: bandit -r . -x ./venv,./tests

      - name: Lancement des tests
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: 'False'
          DJANGO_SETTINGS_MODULE: config.settings.development
          DB_NAME: noxwe_test_db
          DB_USER: noxwe_user
          DB_PASSWORD: noxwe_test_password
          DB_HOST: localhost
          DB_PORT: '5432'
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py check
          pytest --cov=. --cov-report=term-missing